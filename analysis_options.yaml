# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
analyzer:
  exclude:
    # Deliberately invalid boundary fixtures are parsed by the Python
    # contract tests and must not be treated as application Dart sources.
    - tools/usp_boundary/fixtures/**
    # The four below are written by `flutter pub get` itself, not by hand. It
    # announces "Upgrading analysis_options.yaml to exclude build and platform
    # directories" and appends whichever of them are absent. Committed rather
    # than reverted, and not editable in isolation either: `pub get` re-adds any
    # one of the four you delete, on the next command, silently. Removing a line
    # here means opting out at the tool level, not at this file.
    #
    # The list is pin-shaped. 3.47.0 wrote all six platform names whether the
    # directory existed or not; flutter/191131, shipped in 3.47.2, narrows it to
    # the ones that do — here `android/`, `ios/` and `web/`, with `windows/`,
    # `macos/` and `linux/` absent. Measured, not inferred: this block was
    # stripped and re-migrated under 3.47.2 to get these exact four lines.
    #
    # And the migration is not symmetric, which is the part that will surprise you.
    # 3.47.2 leaves these four alone (measured). But running any 3.47.0-era
    # `flutter`/`dart` against this tree — an unpinned shell, a bisect, a second
    # SDK invoked by absolute path — appends `windows/**`, `macos/**` and
    # `linux/**` on the spot, because that version reads a four-line block as
    # incomplete. It happened while this comment was being written. Nothing
    # removes them afterwards, so if you see seven entries here, an older SDK
    # touched the tree: delete the three and re-run `fvm flutter pub get`.
    #
    # WHAT THIS COSTS, which matters more than the archaeology: `web/**` is an
    # exclusion with no expiry, added in the same change that made warnings fatal
    # in CI (.github/workflows/ci.yml). Today it forbids nothing — none of the
    # three platform directories holds a single `.dart` file — but the first JS
    # interop shim written under `web/` lands outside both `flutter analyze` and
    # that gate, and nothing will say so. `web/` is also the directory the CanvasKit
    # vendoring touches most. So: if you add Dart under `web/`, narrow this entry
    # to the generated subpaths instead of leaving it whole, and expect `pub get`
    # to fight you (see above) rather than assuming the edit stuck.
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    prefer_const_constructors: ignore
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at
  # https://dart-lang.github.io/linter/lints/index.html.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
