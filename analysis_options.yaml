# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
analyzer:
  exclude:
    # Deliberately invalid boundary fixtures are parsed by the Python
    # contract tests and must not be treated as application Dart sources.
    - tools/usp_boundary/fixtures/**
    # The four below are written by `flutter pub get` itself, not by hand. It
    # announces "Upgrading analysis_options.yaml to exclude build and platform
    # directories" and appends them when they are absent. Committed rather than
    # reverted, because reverting only makes the tree dirty on the next command.
    #
    # The list is pin-shaped, which is the reason it is worth a comment. 3.47.0
    # wrote all six platform names whether the directory existed or not;
    # flutter/191131, shipped in 3.47.2, narrows it to the ones that do — here
    # `android/`, `ios/` and `web/`, with `windows/`, `macos/` and `linux/`
    # absent. Measured rather than inferred: this block was stripped and
    # re-migrated under 3.47.2 to get these exact four lines.
    #
    # The migration is one-way, not re-applied per run: with the block already
    # present, `pub get` leaves it completely alone (also measured). So a tree
    # migrated by 3.47.0 keeps its seven lines forever even after the pin moves
    # to 3.47.2 — these four are deliberate, and no future bump will correct
    # them on our behalf.
    #
    # Practical effect: `build/**` alone. None of the three platform directories
    # that do exist here holds a single `.dart` file.
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    prefer_const_constructors: ignore
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at
  # https://dart-lang.github.io/linter/lints/index.html.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
