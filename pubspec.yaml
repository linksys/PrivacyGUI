name: privacy_gui
description: A Flutter-based application for managing Linksys networking devices. It provides a comprehensive interface for users to monitor and control their network settings, connected devices, and other router functionalities.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.7.0+100000

environment:
  # Deliberately below the toolchain we build with: the language version this
  # package compiles at is ours to choose, and nothing here needs a newer one
  # (#1456 §2).
  sdk: ">=3.3.0 <4.0.0"
  # The real floor since ui_kit 3.0.0, held at `.fvmrc`'s major.minor.
  #
  # This line protects nothing that was unprotected — pub already refuses on an
  # older toolchain, naming `ui_kit_library requires Flutter SDK version
  # >=3.47.0` from the kit's own pubspec, so the failure was already loud and
  # already pointed at the cause. What it fixes is a false claim: a package that
  # says `>=3.3.0` while being unbuildable on anything under 3.47 is describing
  # someone else's repository (#1456).
  flutter: ">=3.47.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  flutter_launcher_icons: ^0.13.1
  flutter_svg: ^2.0.10
  http: ^1.2.2
  flutter_native_splash: ^2.3.2
  test: ^1.19.5
  equatable: ^2.0.5
  device_info_plus: ^11.1.0
  logger: ^2.0.2
  path_provider: ^2.1.0
  share_plus: ^10.1.0
  package_info_plus: ^8.1.0
  uuid: ^4.4.2
  flutter_inappwebview: ^5.7.0
  shared_preferences: ^2.0.15
  qr_flutter: ^4.0.0
  url_launcher: ^6.1.5
  local_auth: ^2.1.7
  image: ^4.1.0
  collection: ^1.19.0
  flutter_secure_storage: ^10.3.1

  # One repository, two entries — `generative_ui` only adds `path:`. Bump both or
  # neither. A mismatch is loud rather than silent today: both halves pull the same
  # `gen_ui_contracts` path dependency, so pub refuses to resolve two commits of it
  # (#1456). Requires Flutter >= 3.47 since ui_kit 3.0.0; see `.fvmrc`.
  ui_kit_library:
    git:
      url: https://github.com/linksys/privacyGUI-UI-kit.git
      ref: v3.2.0
  generative_ui:
    git:
      url: https://github.com/linksys/privacyGUI-UI-kit.git
      ref: v3.2.0
      path: generative_ui
  flutter_blue_plus: ^1.4.0
  crypto: ^3.0.2
  encrypt: ^5.0.3
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0
  qr: ^3.0.1
  animated_list_plus: ^0.5.2
  http_parser: ^4.0.2
  meta: ^1.11.0
  printing: ^5.14.3
  get_it: ^7.7.0
  pdf: ^3.11.1
  web: ^1.1.1
  file_picker: ^8.0.7
  flutter_staggered_grid_view: ^0.7.0
  sliver_dashboard: ^2.6.0
  async: ^2.11.0
  path: ^1.9.0
  flutter_dotenv: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  # riverpod_generator: ^2.1.3
  # riverpod_lint: ^2.3.9
  mocktail: ^1.0.4
  mockito: ^5.4.6
  integration_test:
    sdk: flutter
  alchemist: ^0.14.0
  flutter_svg_test: ^1.0.1
  fake_async: any
  xml: ^6.5.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.1
  args: ^2.6.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/agents/
    - assets/config/
    - assets/icons/
    - assets/resources/
    - assets/a2ui/widgets/
    - assets/theme/
    - assets/fonts/fallback/

  # Non-Latin fallback fonts (CJK subsets built from the interface charset — see
  # tools/font_subset/ — plus Thai/Arabic/Latin-ext and Roboto). Declared under
  # fonts: so the engine registers them before the first frame; this is what
  # stops the CanvasKit fallback manager from probing the CDN (verified: as
  # assets-only they were probed; declared here, zero CDN). Family names are
  # package-prefixed to match ui_kit's AppText fallback injection and app.dart's
  # textTheme fallback. Offline-first: all locales must render without network.
  fonts:
    - family: packages/ui_kit_library/NotoSansSC
      fonts:
        - asset: assets/fonts/fallback/NotoSansCJKsc.subset.woff2
    - family: packages/ui_kit_library/NotoSansTC
      fonts:
        - asset: assets/fonts/fallback/NotoSansCJKtc.subset.woff2
    - family: packages/ui_kit_library/NotoSansHK
      fonts:
        - asset: assets/fonts/fallback/NotoSansCJKhk.subset.woff2
    - family: packages/ui_kit_library/NotoSansJP
      fonts:
        - asset: assets/fonts/fallback/NotoSansCJKjp.subset.woff2
    - family: packages/ui_kit_library/NotoSansKR
      fonts:
        - asset: assets/fonts/fallback/NotoSansCJKkr.subset.woff2
    - family: packages/ui_kit_library/NotoSansThai
      fonts:
        - asset: assets/fonts/fallback/NotoSansThai.woff2
    - family: packages/ui_kit_library/NotoSansArabic
      fonts:
        - asset: assets/fonts/fallback/NotoSansArabic.woff2
    - family: packages/ui_kit_library/NotoSansLatinExt
      fonts:
        - asset: assets/fonts/fallback/NotoSans-Latin.woff2
    # Roboto is the engine's built-in default global fallback
    # (globalFontFallbacks = ['Roboto']). Declared with its BARE family name so
    # the engine finds it locally instead of probing the CDN on startup.
    - family: Roboto
      fonts:
        - asset: assets/fonts/fallback/Roboto.woff2

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:

  # fonts:
  #   - family: NeueHaasGrotTextRound
  #     fonts:
  #       - asset: fonts/NeueHaasGrotTextRound-55Roman.otf
  #       - asset: fonts/NeueHaasGrotTextRound-75Bold.otf
  #         weight: 700

  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
