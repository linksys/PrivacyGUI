tags:
  golden:
  loc:
  ui:
  # Defensive widget gates that must run in the PR test command (#1183), said in
  # the name since #1336: a PR-blocking defensive layout gate. All 41 carriers
  # are one — density, readability, form and gesture, layout-block, probe
  # self-test, ratchet oracle, sweep-runner oracle, card-gate oracle,
  # render-parity and overflow.
  # NOT excluded by run_tests.sh's --exclude-tags="golden||loc||ui", so a
  # failure here blocks the PR — and tagging one of these `golden`, `loc` or
  # `ui` instead is how a gate leaves the PR command in silence.
  layout-gate:
  # The pre-commit selector: `flutter test --tags overflow` runs the four sweeps
  # and nothing else. Carried in addition to `layout-gate`, and only by a suite
  # that pumps cells and asserts zero overflow — not by everything a verdict
  # depends on, which would slide back to the whole family (the probe
  # self-tests are deliberately excluded — and so are the framework's own
  # oracles: `test/layout_gate/sweep_test.dart` since #1342 and
  # `test/layout_gate/families/dashboard_card_gate_test.dart` since #1343).
  #
  # Complete, not quick: `@Tags` is read by loading a suite, so the tag compiles
  # all 317 test files to skip 313 of them. Measured 2026-08-22 after
  # #1344/#1345, the same 273 tests take 2m09s under the tag and 27s when the
  # four files are named (shell clock; `flutter test`'s own is 1m53s and 19s).
  # Name the file for a tight loop; use the tag when a fifth sweep must not be
  # missed.
  #
  # 273, not the 590 this said after #1343 nor the 2,412 before it: every sweep
  # now loops its locales inside one test per coordinate, so the same 3,587 cells
  # are declared by 273 tests (card 99, popup 80, chrome 57, forced-form 37).
  # Cells are what the gate measures; the test count is how they are named.
  overflow:
