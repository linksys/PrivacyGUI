tags:
  golden:
  loc:
  ui:
  # Defensive widget gates that must run in the PR test command (#1183), said in
  # the name since #1336: a PR-blocking defensive layout gate. All 47 carriers
  # are one — density, readability, form and gesture, layout-block, probe
  # self-test, ratchet oracle, sweep-runner oracle, card-gate oracle,
  # page-family oracle, render-parity and overflow. 41 until the `dev-2.7.0` merge
  # on 2026-08-24 brought three files written against the retired `dashboard-card`
  # name (two detail-view sweeps from #1302 and a density suite from #1321);
  # renaming their tag is what enrolled them, and the count is here so the next
  # such file is noticed rather than merged in silence. 44 until #1349's page pilot
  # the same day added two: the page sweep and its oracle. 46 until #1367 — whose
  # branch predates the rename and arrived carrying `dashboard-card` for the fourth
  # time, which is this note working as intended: `usp_stats_panel_test.dart` is
  # renamed and enrolled, making it **47**.
  # NOT excluded by run_tests.sh's --exclude-tags="golden||loc||ui", so a
  # failure here blocks the PR — and tagging one of these `golden`, `loc` or
  # `ui` instead is how a gate leaves the PR command in silence.
  layout-gate:
  # The pre-commit selector: `flutter test --tags overflow` runs the five sweeps
  # and nothing else. Carried in addition to `layout-gate`, and only by a suite
  # that pumps cells and asserts zero overflow — not by everything a verdict
  # depends on, which would slide back to the whole family (the probe
  # self-tests are deliberately excluded — and so are the framework's own
  # oracles: `test/layout_gate/sweep_test.dart` since #1342,
  # `test/layout_gate/families/dashboard_card_gate_test.dart` since #1343 and
  # `test/layout_gate/families/page_surface_family_test.dart` since #1349).
  #
  # Complete, not quick: `@Tags` is read by loading a suite, so the tag compiles
  # all 325 test files to skip 320 of them. Re-measured 2026-08-24 for #1349, the
  # same 296 tests take 2m03s under the tag and 32.1s when the five files are
  # named (shell clock; `flutter test`'s own is 1m48s and 25s). Name the file for
  # a tight loop; use the tag when a sixth sweep must not be missed — the fifth
  # arrived on the day this comment last said "fifth", which is the argument.
  #
  # 296, not the 590 this said after #1343 nor the 2,412 before it: every sweep
  # now loops its locales inside one test per coordinate, so the same 4,032 cells
  # are declared by 296 tests (card 102, popup 80, chrome 57, forced-form 38,
  # page 19 — 18 of them cells, the nineteenth a readability guard that pumps
  # 52 trees and names none). Cells are what the gate measures; the test count is
  # how they are named.
  #
  # +4 tests and +29 cells at the merge, and no sweep was edited for either:
  # #1325 gave `dhcp_reservations` a `normalAbove`, which put it in the normal
  # band's sweep and in `selectableForms(compact)`. The clock did not move — the
  # cost here is compiling 325 suites, not pumping 29 more cells.
  #
  # #1349 is the first entry here whose cells are expensive: 416 of them at 33-38ms,
  # ~6x a chrome cell, because each pumps a whole page with its providers. It still
  # does not show up under this tag (2m03s against 2m08s at the merge — load noise
  # dominates), but it is +14s on `--tags layout-gate`, and on the whole PR gate it
  # is +36s of CPU for -1s of wall (5,362 tests in 2m43s; 5,343 in 2m44s with the
  # file moved aside). Two pilot pages are in the gate by decision, not as a class:
  # see overflow_gate_architecture.md section 11.
  overflow:
