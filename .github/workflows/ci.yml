name: PrivacyGUI CI/CD

on:
  # Only `pull_request`, and see the note at the bottom of this file for why: the
  # golden jobs that `push`, `workflow_dispatch` and `schedule` existed for are
  # not in this repo.
  pull_request:
    branches: [ "main", "dev-*" ]

# Cancel previous runs if a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================================
  # Pull Request Checks (Fast Fail)
  # ------------------------------------------------------------------------
  # Focus: Logic, Syntax, Compilation
  # Trigger: Pull Request
  #
  # The only job in this repo. It was "STAGE A" of three until #1346 deleted the
  # commented-out remains of the other two — see the note at the bottom.
  # ========================================================================
  pr_quality_check:
    name: 🛡️ Quality & Logic (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Setup SSH for private dependencies (Deploy Key approach)
      - name: 🔑 Setup SSH for Private Deps
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UI_KIT_DEPLOY_KEY }}

      # Force git to use SSH instead of HTTPS
      - name: 🔄 Configure Git to use SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: 📋 Setup Environment File
        run: cp assets/agents/env.template assets/agents/.env

      - name: Install Dependencies
        run: flutter pub get

      # Generate l10n files (ignored by .gitignore, must be generated before analyze)
      - name: 🌐 Generate L10n
        run: flutter gen-l10n

      # 1. Static Analysis (Linter)
      - name: 🔍 Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # 2. Formatting Check
      - name: 🎨 Dart Format Check
        run: dart format --output=none --set-exit-if-changed .

      # 3. Unit Tests (Pure Logic)
      - name: 🧪 Unit Tests
        run: sh run_tests.sh

      # 4. Smoke Build (Web)
      - name: 🏗️ Smoke Build (Web)
        run: flutter build web --release --no-pub

  # ========================================================================
  # Golden / snapshot jobs are deliberately not in this repo
  # ------------------------------------------------------------------------
  # They live in linksys/PrivacyGUI-golden-ci, which clones this repo and runs
  # its scripts itself: run_generate_loc_snapshots.sh to generate baselines,
  # run_golden_verify.sh to verify against them.
  #
  # The reason is ownership of the baseline PNGs. This repo gitignores them
  # (.gitignore: test/**/goldens/*, snapshots/*), so a job here would have
  # nothing to compare against — and blessing a rendering as correct is a human
  # judgement, not something to fire on every push.
  #
  # Two commented-out jobs stood here until #1346. They are deleted rather than
  # kept as a starting point, because neither ever worked:
  #
  #  * main_snapshot_baseline (push to main / workflow_dispatch) uploaded
  #    snapshots/, a path run_generate_loc_snapshots.sh does not write — the
  #    golden runner writes test/golden_test/**/goldens/. It produced empty
  #    artifacts for as long as it ran.
  #  * nightly_deep_check (schedule) ran `dart tools/run_screenshot_tests.dart`.
  #    That script does still exist; what the job lacked was the baselines.
  #
  # Their push:, workflow_dispatch: and schedule: triggers went with them, which
  # is why `on:` above lists only pull_request: every job here is gated on that
  # event, so the other three produced workflow runs with no jobs in them.
  # ========================================================================
