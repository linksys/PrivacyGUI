# Transform file for example_transform.yaml
# Defines computed properties based on raw test data
# Generated code will create extension classes with these computed getters

name: SpeedTest
transforms:
  - name: throughputMbps
    description: Download throughput in megabits per second
    type: formula
    formula: "(TestBytesReceived * 8) / (TestDuration * 1000)"
    inputs:
      - TestBytesReceived
      - TestDuration
    output_type: double
    unit: Mbps
    display:
      formatter: bandwidth
      precision: 2

  - name: throughputKbps
    description: Download throughput in kilobits per second
    type: formula
    formula: "(TestBytesReceived * 8) / TestDuration"
    inputs:
      - TestBytesReceived
      - TestDuration
    output_type: double
    unit: Kbps
    display:
      formatter: speed
      precision: 2

  - name: completionPercent
    description: Download completion percentage
    type: formula
    formula: "(TestBytesReceived * 100) / TotalBytesReceived"
    inputs:
      - TestBytesReceived
      - TotalBytesReceived
    output_type: double
    display:
      formatter: percent
      precision: 1

  - name: totalBytes
    description: Total bytes transferred (received + sent)
    type: formula
    formula: "TotalBytesReceived + TotalBytesSent"
    inputs:
      - TotalBytesReceived
      - TotalBytesSent
    output_type: double
    display:
      formatter: number

  - name: diagnosticsStateDisplay
    description: Human-readable diagnostic state
    type: mapping
    input: DiagnosticsState
    default: speedtest_state_unknown
    mappings:
      None: speedtest_state_none
      Requested: speedtest_state_requested
      Complete: speedtest_state_complete
      Error_InitConnectionFailed: speedtest_state_conn_failed
      Error_NoResponse: speedtest_state_no_response
      Error_TransferFailed: speedtest_state_transfer_failed
      Error_Timeout: speedtest_state_timeout

  - name: durationFormatted
    description: Human-readable test duration
    type: converter
    input: TestDuration
    converter: formatDuration
    output_type: string
