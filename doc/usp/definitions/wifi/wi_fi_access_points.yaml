# WiFi access point status and security
# SSH-verified 2026-03-06

name: WiFiAccessPoints
singularName: WiFiAccessPoint
version: 1.0.0
multiInstance: Device.WiFi.AccessPoint.
category: wifi
description: WiFi access point status and security

parameters:
  - field_name: enable
    path: .Enable
    type: boolean
    description: Whether this access point is enabled

  - field_name: status
    path: .Status
    type: string
    description: Operational status (Up, Disabled, Error)

  - field_name: securityModeEnabled
    path: .Security.ModeEnabled
    type: string
    description: Active security mode (None, WPA2-Personal, WPA3-Personal, etc.)

  - field_name: encryptionMode
    path: .Security.EncryptionMode
    type: string
    description: Encryption mode (AES, TKIP+AES, etc.)

  - field_name: keyPassphrase
    path: Security.KeyPassphrase
    type: string
    writable: true
    sensitive: true
    description: WPA/WPA2/WPA3 passphrase

  - field_name: macAddressControlEnabled
    path: MACAddressControlEnabled
    type: boolean
    writable: true
    description: Enable MAC address access control (allow-list mode)

  - field_name: ssidReference
    path: .SSIDReference
    type: string
    description: Reference to SSID object (e.g. Device.WiFi.SSID.1.)
