name: dataElementsNetwork
singularName: meshNode
version: 1.0.0
base_path: Device.WiFi.DataElements.Network.Device
category: wifi
description: EasyMesh DataElements network topology — mesh nodes, radios, BSSes, and client stations
multi_instance: true

parameters:
  - field_name: id
    path: ID
    type: string
    description: Device identifier (typically MAC address of the mesh node)

  - field_name: manufacturerModel
    path: ManufacturerModel
    type: string
    description: Model name of the mesh node (e.g., MR7500, WHW03)

  - field_name: manufacturer
    path: Manufacturer
    type: string
    description: Manufacturer name of the mesh node

  - field_name: serialNumber
    path: SerialNumber
    type: string
    description: Serial number of the mesh node

  - field_name: softwareVersion
    path: SoftwareVersion
    type: string
    description: Current firmware/software version of the mesh node

children:
  - name: radios
    singularName: meshRadio
    basePath: .Radio.
    parameters: []
    children:
      - name: bssList
        singularName: meshBss
        basePath: .BSS.
        parameters:
          - field_name: bssid
            path: BSSID
            type: string
            description: BSS identifier (MAC address of the BSS)
          - field_name: ssid
            path: SSID
            type: string
            description: Network name advertised by this BSS
        children:
          - name: stations
            singularName: meshStation
            basePath: .STA.
            parameters:
              - field_name: macAddress
                path: MACAddress
                type: string
                description: Client station MAC address
              - field_name: signalStrength
                path: SignalStrength
                type: int
                description: Client signal strength in dBm
