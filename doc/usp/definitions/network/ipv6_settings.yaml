name: Ipv6Settings
version: 1.0.0
category: network
description: WAN IPv6 connection and 6rd tunnel configuration

parameters:
  # === IPv6 Interface ===
  - path: Device.IP.Interface.2.IPv6Enable
    field_name: ipv6Enabled
    type: boolean
    writable: true
    description: Enable IPv6 on WAN interface

  # === DHCPv6 Client ===
  - path: Device.DHCPv6.Client.1.Enable
    field_name: dhcpv6Enabled
    type: boolean
    writable: true
    description: Enable DHCPv6 client

  - path: Device.DHCPv6.Client.1.DUID
    field_name: dhcpv6Duid
    type: string
    description: DHCPv6 Unique Identifier (read-only, set by CPE)

  # === 6rd Tunnel ===
  - path: Device.IPv6rd.InterfaceSetting.1.Enable
    field_name: ipv6rdEnabled
    type: boolean
    writable: true
    description: Enable 6rd tunnel interface

  - path: Device.IPv6rd.InterfaceSetting.1.SPIPv6Prefix
    field_name: ipv6rdPrefix
    type: string
    writable: true
    description: Service provider 6rd IPv6 prefix

  - path: Device.IPv6rd.InterfaceSetting.1.IPv4MaskLength
    field_name: ipv6rdIpv4MaskLength
    type: int
    writable: true
    description: Number of IPv4 address bits to embed in 6rd prefix (0-32)

  - path: Device.IPv6rd.InterfaceSetting.1.BorderRelayIPv4Addresses
    field_name: ipv6rdBorderRelay
    type: string
    writable: true
    description: 6rd border relay IPv4 address(es)

  # === NO TR-181 MAPPING (preserved from JNAP for reference) ===
  # - field_name: ipv6WanType
  #   jnap_source: ipv6Settings.wanType
  #   type: string
  #   description: "IPv6 WAN type (Automatic/Static/Bridge/6rd/SLAAC/DHCPv6/PPPoE/Pass-through) — TR-181 determines type by multiple parameter combination, no single field"
  #
  # - field_name: ipv6rdTunnelMode
  #   jnap_source: ipv6AutomaticSettings.ipv6rdTunnelMode
  #   type: string
  #   description: "6rd tunnel mode (Disabled/Automatic/Manual) — maps to IPv6rd.Enable + configuration state, not a single TR-181 field"
  #
  # - field_name: ipv6rdBorderRelayPrefixLength
  #   jnap_source: ipv6rdTunnelSettings.borderRelayPrefixLength
  #   type: int
  #   description: "6rd border relay prefix length — TR-181 IPv6rd does not have this as a separate parameter"
