# Multi-instance test definition #2
# Purpose: Validate codegen multi_instance support with writable parameters

name: PortForwarding
singularName: PortForwardingRule
version: 1.0.0
base_path: Device.NAT.PortMapping
category: firewall
description: NAT port forwarding rules (multi-instance)

# Multi-instance flag
multi_instance: true

parameters:
  - field_name: enabled
    path: Enable
    type: boolean
    writable: true
    description: Enable this rule

  - field_name: externalPort
    path: ExternalPort
    type: int
    writable: true
    description: External port number

  - field_name: internalPort
    path: InternalPort
    type: int
    writable: true
    description: Internal port number

  - field_name: internalClient
    path: InternalClient
    type: string
    writable: true
    description: Internal client IP address

  - field_name: protocol
    path: Protocol
    type: string
    writable: true
    description: Protocol (TCP, UDP, or Both)

  - field_name: description
    path: Description
    type: string
    writable: true
    description: Rule description
