name: AdminUsers
singularName: AdminUser
version: 1.0.0
multiInstance: Device.Users.User.
category: admin
description: Router admin user accounts (multi-instance)

parameters:
  - field_name: username
    path: .Username
    type: string
    description: User login name

  - field_name: password
    path: .Password
    type: string
    writable: true
    description: User password (write-only — returns null on read)

  - field_name: enable
    path: .Enable
    type: boolean
    description: Whether user account is enabled
