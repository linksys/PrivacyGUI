# Firewall Chain.1 rules — the "Defaults Configuration" chain contains
# all SPI, VPN passthrough, and internet filter rules that map to
# JNAP GetFirewallSettings / SetFirewallSettings.
#
# BUG-002: Device.Firewall. top-level GET returns empty.
# Workaround: query Chain.1.Rule. directly (sub-object paths work).
#

name: FirewallChainRules
singularName: FirewallChainRule
version: 1.0.0
multiInstance: Device.Firewall.Chain.1.Rule.
category: firewall
description: Firewall chain rules (multi-instance, writable Enable toggle)

parameters:
  - field_name: enable
    path: .Enable
    type: boolean
    writable: true
    description: Whether this rule is active

  - field_name: description
    path: .Description
    type: string
    description: Rule name used for feature identification

  - field_name: target
    path: .Target
    type: string
    description: Rule action (Accept or Drop)
