name: PortForwarding
singularName: PortForwardingRule
version: 1.0.0
multiInstance: Device.NAT.PortMapping.
category: firewall
description: NAT port forwarding rules (multi-instance)
type: add

parameters:
  - field_name: enabled
    path: .Enable
    type: boolean
    writable: true
    description: Enable this rule

  - field_name: externalPort
    path: .ExternalPort
    type: int
    writable: true
    description: External port number

  - field_name: externalPortEndRange
