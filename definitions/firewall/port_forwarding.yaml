    type: int
    writable: true
    description: End of external port range (0 = single port)

  - field_name: internalPort
    path: .InternalPort
    type: int
    writable: true
    description: Internal port number

  - field_name: internalClient
    path: .InternalClient
    type: string
    writable: true
    description: Internal client IP address

  - field_name: protocol
    path: .Protocol
    type: string
    writable: true
    description: Protocol (TCP, UDP, or Both)

  - field_name: description
    path: .Description
    type: string
    writable: true
    description: Rule description
