name: firmware_images
version: 1.0.0
multiInstance: Device.DeviceInfo.FirmwareImage.
category: core
singularName: firmware_image
description: Firmware image partitions (dual image status)

parameters:
  - field_name: name
    path: .Name
    type: string
    description: Firmware image name (e.g., "1.0.16")

  - field_name: version
    path: .Version
    type: string
    description: Firmware version string (e.g., "1.0.16.26013014")

  - field_name: status
    path: .Status
    type: string
    description: Image status — Active or Available

  - field_name: available
    path: .Available
    type: boolean
    description: Whether this image is available for booting
