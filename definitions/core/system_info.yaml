name: SystemInfo
version: 1.0.0
instance: Device.DeviceInfo
category: core
description: System and device identification

parameters:
  - field_name: manufacturer
    path: .Manufacturer
    type: string
    description: Device manufacturer name

  - field_name: modelName
    path: .ModelName
    type: string
    description: Device model name

  - field_name: serialNumber
    path: .SerialNumber
    type: string
    description: Device serial number

  - field_name: hardwareVersion
    path: .HardwareVersion
    type: string
    description: Hardware version string

  - field_name: softwareVersion
    path: .SoftwareVersion
    type: string
    description: Current firmware/software version

  - field_name: uptime
    path: .UpTime
    type: int
    description: Device uptime in seconds

  - field_name: totalMemory
    path: .MemoryStatus.Total
    type: int
    description: Total memory in KB

  - field_name: freeMemory
    path: .MemoryStatus.Free
    type: int
    description: Free memory in KB

  - field_name: cpuUsage
    path: .ProcessStatus.CPUUsage
    type: int
    description: CPU usage percentage (0-100)

  - field_name: firstUseDate
    path: .FirstUseDate
    type: string
    description: First use date (0001-01-01T00:00:00Z if never configured)

  - field_name: description
    path: .Description
    type: string
    description: Device description

  - field_name: productClass
    path: .ProductClass
    type: string
    description: Product class identifier
