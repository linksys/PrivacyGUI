# WiFi SSID instances (network names)
# SSH-verified 2026-03-06

name: WiFiSsids
singularName: WiFiSsid
version: 1.0.0
multiInstance: Device.WiFi.SSID.
category: wifi
description: WiFi SSID instances (network names)

parameters:
  - field_name: ssid
    path: .SSID
    type: string
    writable: true
    description: The network name/identifier

  - field_name: enable
    path: .Enable
    type: boolean
    writable: true
    description: Whether this SSID interface is enabled

  # NOTE: SSIDAdvertisementEnabled lives on Device.WiFi.AccessPoint.{i}, not SSID.
  # See wi_fi_access_points.yaml

  # TODO(vendor-ext): Device.WiFi.SSID.{i}.X_LINKSYS_COM_IsGuest
  #   Required for: distinguishing guest vs. main SSID in the WiFi settings UI
  #   Pending: firmware support confirmation

  - field_name: status
    path: .Status
    type: string
    description: Operational status (Up, Down, etc.)

  - field_name: bssid
    path: .BSSID
    type: string
    description: Basic Service Set ID (AP MAC address)

  - field_name: lowerLayers
    path: .LowerLayers
    type: string
    description: Reference to the Radio instance (e.g. Device.WiFi.Radio.1.)
