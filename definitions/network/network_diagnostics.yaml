name: NetworkDiagnostics
description: Network diagnostic operations (Ping, Traceroute)
type: operate
category: network

operations:
  - name: ping
    path: Device.IP.Diagnostics.IPPing()
    description: Run ICMP ping diagnostic
    inputs:
      - path: Host
        field: host
        type: string
        required: true
      - path: NumberOfRepetitions
        field: numberOfRepetitions
        type: string
        required: false
        default: "3"

  - name: traceRoute
    path: Device.IP.Diagnostics.TraceRoute()
    description: Run traceroute diagnostic
    inputs:
      - path: Host
        field: host
        type: string
        required: true
      - path: MaxHopCount
        field: maxHopCount
        type: string
        required: false
        default: "30"
