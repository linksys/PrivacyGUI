name: WanStatus
version: 1.1.0
category: network
description: WAN interface status, IPv4 configuration, and IPv6 enable flag

parameters:
  - field_name: status
    path: Device.IP.Interface.2.Status
    type: string
    description: WAN interface status (Up/Down)

  - field_name: ip_address
    path: Device.IP.Interface.2.IPv4Address.1.IPAddress
    type: string
    description: WAN IPv4 address

  - field_name: subnet_mask
    path: Device.IP.Interface.2.IPv4Address.1.SubnetMask
    type: string
    description: WAN subnet mask

  - field_name: addressing_type
    path: Device.IP.Interface.2.IPv4Address.1.AddressingType
    type: string
    description: Addressing type (DHCP, Static, PPPoE)

  - field_name: max_mtu_size
    path: Device.IP.Interface.2.MaxMTUSize
    type: int
    description: Maximum MTU size

  - field_name: ipv6_enabled
    path: Device.IP.Interface.2.IPv6Enable
    type: boolean
    description: Whether IPv6 is enabled on WAN interface
