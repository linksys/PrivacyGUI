name: WanSettings
version: 1.1.0
category: network
description: WAN IPv4 singleton settings — fields that always exist on the device

parameters:
  # === WAN Interface Status ===
  - path: Device.IP.Interface.2.IPv4Address.1.AddressingType
    field_name: addressingType
    type: string
    writable: true
    description: IPv4 addressing type (Static, DHCP, IPCP, AutoIP)

  - path: Device.IP.Interface.2.MaxMTUSize
    field_name: mtu
    type: int
    writable: true
    description: Maximum transmission unit size (64-65535)

  # === Static IP Configuration ===
  - path: Device.IP.Interface.2.IPv4Address.1.IPAddress
    field_name: staticIpAddress
    type: string
    writable: true
    description: Static IPv4 address (used when AddressingType=Static)

  - path: Device.IP.Interface.2.IPv4Address.1.SubnetMask
    field_name: subnetMask
    type: string
    writable: true
    description: IPv4 subnet mask

  # === Gateway & DNS (vendor extension paths — confirmed writable 2026-03-19) ===
  - path: Device.IP.Interface.2.IPv4Address.1.X_LINKSYS_DefaultGateway
    field_name: defaultGateway
    type: string
    writable: true
    description: Default gateway IPv4 address (Linksys vendor extension, replaces non-writable Routing.Router path)

  - path: Device.IP.Interface.2.IPv4Address.1.X_LINKSYS_DNSServers
    field_name: dnsServers
    type: string
    writable: true
    description: DNS servers as comma-separated string (e.g. "8.8.8.8,8.8.4.4"). Replaces non-writable DNS.Client.Server paths.

  # === Bridge Mode ===
  - path: Device.Bridging.Bridge.1.Enable
    field_name: bridgeEnabled
    type: boolean
    writable: true
    description: Enable bridge mode

  # === MAC Address (read-only — ISS-5 writable path not yet found) ===
  - path: Device.Ethernet.Interface.1.MACAddress
    field_name: currentMacAddress
    type: string
    description: Current WAN Ethernet MAC address (read-only)

  # === NO TR-181 MAPPING (preserved from JNAP for reference) ===
  # - field_name: tpServer
  #   jnap_source: tpSettings.server
  #   type: string
  #   description: "PPTP/L2TP tunnel server address (no standard TR-181 path)"
  #
  # - field_name: useStaticSettings
  #   jnap_source: tpSettings.useStaticSettings
  #   type: boolean
  #   description: "Use static IP settings for PPTP (JNAP logic field, no TR-181)"
  #
  # - field_name: domainName
  #   jnap_source: staticSettings.domainName
  #   type: string
  #   description: "Domain name for static configuration (no standard TR-181 path)"
  #
  # - field_name: vlanStatus
  #   jnap_source: wanTaggingSettings.vlanTaggingSettings.vlanStatus
  #   type: string
  #   description: "VLAN tagging status Tagged/Untagged (no standard TR-181)"
  #
  # - field_name: isMACAddressCloneEnabled
  #   jnap_source: isMACAddressCloneEnabled
  #   type: boolean
  #   description: "MAC clone enable flag (Vendor Extension: X_LINKSYS_COM_MACClone.Enable)"
  #
  # - field_name: supportedWANTypes
  #   jnap_source: wanStatus.supportedWANTypes
  #   type: string
  #   description: "Supported WAN connection types (device capability, no TR-181)"
  #
  # - field_name: supportedIPv6WANTypes
  #   jnap_source: wanStatus.supportedIPv6WANTypes
  #   type: string
  #   description: "Supported IPv6 WAN types (device capability, no TR-181)"
  #
  # - field_name: supportedWANCombinations
  #   jnap_source: wanStatus.supportedWANCombinations
