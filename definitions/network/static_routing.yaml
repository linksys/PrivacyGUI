# Static routing IPv4 forwarding rules
# SSH-verified 2026-03-09 via Device.Routing.Router.1.IPv4Forwarding
#
# The routing table contains both kernel routes (Origin=DHCPv4) and
# user-created static routes (Origin=Static). The UI must filter by
# Origin to only show user-configurable entries.
#
# RIP (Device.Routing.RIP.Enable) is NOT supported on this firmware.
# NAT is per-interface (Device.NAT.InterfaceSetting.{i}.Enable), not
# a global toggle like JNAP's isNATEnabled.

name: StaticRouting
singularName: StaticRoute
version: 1.0.0
multiInstance: Device.Routing.Router.1.IPv4Forwarding.
category: network
description: IPv4 static routing table (multi-instance)
type: add

parameters:
  - field_name: enable
    path: .Enable
    type: boolean
    writable: true
    description: Enable/disable this route

  - field_name: dest_ip_address
    path: .DestIPAddress
    type: string
    writable: true
    description: Destination IP address

  - field_name: dest_subnet_mask
    path: .DestSubnetMask
    type: string
    writable: true
    description: Destination subnet mask (dotted decimal)

  - field_name: gateway_ip_address
    path: .GatewayIPAddress
    type: string
    writable: true
    description: Gateway IP address

  - field_name: interface_
    path: .Interface
    type: string
    writable: true
    description: Interface reference (e.g. Device.IP.Interface.1)

  - field_name: origin
    path: .Origin
    type: string
    description: Route origin (Static, DHCPv4, etc.) — read-only

  - field_name: alias
    path: .Alias
    type: string
    writable: true
    description: Route alias/name
