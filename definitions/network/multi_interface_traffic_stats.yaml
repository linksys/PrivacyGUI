name: MultiInterfaceTrafficStats
version: 1.0.0
category: network
description: Multi-interface traffic statistics for WAN vs LAN comparison

parameters:
  # WAN (IP.Interface.2)
  - field_name: wan_bytes_sent
    path: Device.IP.Interface.2.Stats.BytesSent
    type: int
    description: Total bytes sent on WAN interface

  - field_name: wan_bytes_received
    path: Device.IP.Interface.2.Stats.BytesReceived
    type: int
    description: Total bytes received on WAN interface

  - field_name: wan_packets_sent
    path: Device.IP.Interface.2.Stats.PacketsSent
    type: int
    description: Total packets sent on WAN interface

  - field_name: wan_packets_received
    path: Device.IP.Interface.2.Stats.PacketsReceived
    type: int
    description: Total packets received on WAN interface

  - field_name: wan_errors_sent
    path: Device.IP.Interface.2.Stats.ErrorsSent
    type: int
    description: Total error packets sent on WAN interface

  - field_name: wan_errors_received
    path: Device.IP.Interface.2.Stats.ErrorsReceived
    type: int
    description: Total error packets received on WAN interface

  - field_name: wan_discard_packets_sent
    path: Device.IP.Interface.2.Stats.DiscardPacketsSent
    type: int
    description: Total discarded packets on WAN (send direction)

  - field_name: wan_discard_packets_received
    path: Device.IP.Interface.2.Stats.DiscardPacketsReceived
    type: int
    description: Total discarded packets on WAN (receive direction)

  # LAN (IP.Interface.1)
  - field_name: lan_bytes_sent
    path: Device.IP.Interface.1.Stats.BytesSent
    type: int
    description: Total bytes sent on LAN interface

  - field_name: lan_bytes_received
    path: Device.IP.Interface.1.Stats.BytesReceived
    type: int
    description: Total bytes received on LAN interface

  - field_name: lan_packets_sent
    path: Device.IP.Interface.1.Stats.PacketsSent
    type: int
    description: Total packets sent on LAN interface

  - field_name: lan_packets_received
    path: Device.IP.Interface.1.Stats.PacketsReceived
    type: int
    description: Total packets received on LAN interface

  - field_name: lan_errors_sent
    path: Device.IP.Interface.1.Stats.ErrorsSent
    type: int
    description: Total error packets sent on LAN interface

  - field_name: lan_errors_received
    path: Device.IP.Interface.1.Stats.ErrorsReceived
    type: int
    description: Total error packets received on LAN interface

  - field_name: lan_discard_packets_sent
    path: Device.IP.Interface.1.Stats.DiscardPacketsSent
    type: int
    description: Total discarded packets on LAN (send direction)

  - field_name: lan_discard_packets_received
    path: Device.IP.Interface.1.Stats.DiscardPacketsReceived
    type: int
    description: Total discarded packets on LAN (receive direction)
